<!-- No-JS fallback, one second behind so the language script below wins when JS runs. -->
<meta http-equiv="refresh" content="1;url=landing.html">
<script>
// The root is given out as the address of the project (press, cantonal offices, print
// material), so it must land in the reader's own language instead of always English.
// Only the three languages that have a landing are routed; everything else keeps English.
(function () {
  var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
  var dir = "";
  for (var i = 0; i < tags.length; i++) {
    var code = String(tags[i]).slice(0, 2).toLowerCase();
    if (code === "fr" || code === "de" || code === "it") { dir = code + "/"; break; }
    if (code === "en") break;            // an explicit English preference stops the search
  }
  location.replace(dir + "landing.html" + location.search + location.hash);
})();
</script>
